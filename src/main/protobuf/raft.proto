syntax = "proto3";

package coffer.raft;

option java_package = "io.github.brunomvpcosta.coffer.protocol";
option java_outer_classname = "RaftProtocol";

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes command = 3;
}

message RequestVote {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntries {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message Snapshot {
  uint64 last_included_index = 1;
  uint64 last_included_term = 2;
  bytes data = 3;
}

message InstallSnapshot {
  uint64 term = 1;
  string leader_id = 2;
  Snapshot snapshot = 3;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message RaftMessage {
  oneof payload {
    RequestVote request_vote = 1;
    RequestVoteResponse request_vote_response = 2;
    AppendEntries append_entries = 3;
    AppendEntriesResponse append_entries_response = 4;
    InstallSnapshot install_snapshot = 5;
    InstallSnapshotResponse install_snapshot_response = 6;
  }
}

message PersistentState {
  uint64 current_term = 1;
  string voted_for = 2;
  repeated LogEntry log = 3;
}
