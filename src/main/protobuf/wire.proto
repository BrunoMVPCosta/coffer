syntax = "proto3";

package coffer.wire;

option java_package = "io.github.brunomvpcosta.coffer.protocol";
option java_outer_classname = "WireProtocol";

message Envelope {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    APPLICATION = 1;
    CLUSTER = 2;
    RAFT = 3;
    KV = 4;
  }

  string message_id = 1;
  Kind kind = 2;
  bytes payload = 3;
}
