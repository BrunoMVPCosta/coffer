name: coffer

services:
  node1:
    image: coffer:latest
    build: .
    command: ["8080", "node2:8081", "node3:8082"]
    environment:
      NODE_HOST: node1
      CLUSTER_NAME: coffer-cluster
      RAFT_SNAPSHOT_THRESHOLD: ${RAFT_SNAPSHOT_THRESHOLD:-1024}
      RAFT_DATA_DIR: /data
    volumes:
      - node1-data:/data
    ports:
      - "8080:8080"

  node2:
    image: coffer:latest
    command: ["8081", "node1:8080", "node3:8082"]
    environment:
      NODE_HOST: node2
      CLUSTER_NAME: coffer-cluster
      RAFT_SNAPSHOT_THRESHOLD: ${RAFT_SNAPSHOT_THRESHOLD:-1024}
      RAFT_DATA_DIR: /data
    volumes:
      - node2-data:/data
    ports:
      - "8081:8081"

  node3:
    image: coffer:latest
    command: ["8082", "node1:8080", "node2:8081"]
    environment:
      NODE_HOST: node3
      CLUSTER_NAME: coffer-cluster
      RAFT_SNAPSHOT_THRESHOLD: ${RAFT_SNAPSHOT_THRESHOLD:-1024}
      RAFT_DATA_DIR: /data
    volumes:
      - node3-data:/data
    ports:
      - "8082:8082"

volumes:
  node1-data:
  node2-data:
  node3-data:
